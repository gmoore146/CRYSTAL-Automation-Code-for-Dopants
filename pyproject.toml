[project]
name = "crystal-dopants"
version = "0.1.0"
description = "Automates CRYSTAL/PROPERTIES inputs and PBS jobs for doped Ga2O3 defect calculations"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
make-d12 = "crystal_dopants.make_d12:main"
make-d3 = "crystal_dopants.make_d3:main"
make-qsub = "crystal_dopants.make_qsub:main"
submit = "crystal_dopants.submit:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crystal_dopants"]
